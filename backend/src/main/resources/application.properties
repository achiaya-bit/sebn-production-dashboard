spring.application.name=dashboard

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sebn_dashboard}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# DATA_MODE controls the data source label exposed on /api/dashboard/data-freshness.
# IMPORTED = data was loaded from an exported dataset dump (default).
# LIVE     = set only when a real WAO-to-MySQL synchronisation process is running.
data.mode=${DATA_MODE:IMPORTED}